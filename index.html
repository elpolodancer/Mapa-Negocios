<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Negocios - Prototipo</title>

<!-- Leaflet (mapa gratuito, sin API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

  /* Le da un aspecto "apagado" al mapa base, como si estuviera vacío de negocios */
  .leaflet-tile-pane { filter: grayscale(35%) contrast(95%) brightness(1.03); }

  .marker-gris {
    background: #9aa0a6;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  .marker-activo {
    width: 38px; height: 38px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.4);
    border: 2px solid #fff;
  }
  .marker-activo span {
    transform: rotate(45deg);
    font-size: 18px;
  }

  .popup-negocio { text-align: center; font-size: 14px; }
  .popup-negocio a {
    display: inline-block;
    margin-top: 6px;
    padding: 6px 14px;
    background: #1a73e8;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
  }
  .popup-negocio.inactivo p { color: #777; font-size: 12px; margin-top: 4px; }

  /* ---------- Botón circular de menú ---------- */
  #btnMenu {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 1000;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #btnMenu:active { background: #f1f1f1; }

  /* ---------- Barra lateral ---------- */
  #sidebar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 290px;
    max-width: 85vw;
    background: #fff;
    z-index: 999;
    box-shadow: 2px 0 10px rgba(0,0,0,.25);
    transform: translateX(-100%);
    transition: transform .25s ease;
    display: flex;
    flex-direction: column;
    padding-top: 72px;
    overflow-y: auto;
  }
  #sidebar.abierto { transform: translateX(0); }

  .sb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 14px 18px;
    background: none;
    border: none;
    border-bottom: 1px solid #eee;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
  }
  .sb-item:hover { background: #f6f6f6; }

  #submenuMarcadores { display: none; background: #fafafa; }
  #submenuMarcadores.abierto { display: block; }

  .marcador-casilla {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 10px 34px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .marcador-casilla .nombre-btn {
    flex: 1;
    text-align: left;
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
    color: #202124;
  }
  .marcador-casilla .nombre-btn.sin-nombre { color: #888; font-style: italic; }
  .btn-ubicar {
    border: none;
    background: #e8f0fe;
    color: #1a73e8;
    border-radius: 14px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-anadir {
    margin: 8px 18px 14px 18px;
    padding: 10px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  #avisoColocar {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: #202124;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }

  /* ---------- Modal de configuración ---------- */
  #overlayModal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #overlayModal.abierto { display: flex; }
  #modalConfig {
    background: #fff;
    width: 300px;
    max-width: 90vw;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  #modalConfig h3 { margin-bottom: 12px; font-size: 16px; }
  #modalConfig label {
    display: block;
    font-size: 12px;
    color: #555;
    margin: 10px 0 4px;
  }
  #modalConfig input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .modal-botones {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-botones button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  #btnGuardarMarcador { background: #1a73e8; color: #fff; }
  #btnCancelarMarcador { background: #eee; color: #333; }
</style>
</head>
<body>

<div id="map"></div>

<button id="btnMenu" title="Menú">☰</button>

<div id="avisoColocar">Toca el mapa para colocar el marcador…</div>

<div id="sidebar">
  <button class="sb-item" id="btnMarcadores">📍 Marcadores</button>
  <div id="submenuMarcadores">
    <div id="listaMarcadores"><!-- casillas generadas por JS --></div>
    <button class="btn-anadir" id="btnAnadirMarcador">➕ Añadir marcador</button>
  </div>
</div>

<div id="overlayModal">
  <div id="modalConfig">
    <h3>Configurar marcador</h3>
    <label for="inpNombre">Nombre del negocio</label>
    <input type="text" id="inpNombre" placeholder="Ej. Panadería Ejemplo">

    <label for="inpEmoji">Emoji (opcional)</label>
    <input type="text" id="inpEmoji" placeholder="🥖" maxlength="4">

    <label for="inpColor">Color (opcional)</label>
    <input type="color" id="inpColor" value="#1a73e8">

    <label for="inpUrl">Enlace de la página web (opcional)</label>
    <input type="url" id="inpUrl" placeholder="https://tuusuario.github.io/sitio/">

    <div class="modal-botones">
      <button id="btnCancelarMarcador">Cancelar</button>
      <button id="btnGuardarMarcador">Guardar</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATOS DE NEGOCIOS
   -----------------------------------------------------------
   Aquí va cada negocio que quieras mapear. Mientras "activo"
   sea false, se muestra como punto gris sin liga.
   Cuando termines su página web, cambia "activo" a true,
   agrega el "emoji", el "color" y la "url".

   Más adelante esto se puede migrar a Google Sheets (CSV),
   igual que tus otros proyectos, para no editar código cada vez.
   ========================================================= */
const negocios = [
  {
    nombre: "Panadería Ejemplo",
    categoria: "Panadería",
    lat: 19.7030, lng: -101.1900,
    activo: true,
    emoji: "🥖",
    color: "#e8710a",
    url: "https://tuusuario.github.io/panaderia-ejemplo/"
  },
  {
    nombre: "Ferretería Ejemplo",
    categoria: "Ferretería",
    lat: 19.6990, lng: -101.1800,
    activo: false // aún no le has hecho página web -> se ve gris
  },
  {
    nombre: "Restaurante Ejemplo",
    categoria: "Restaurante",
    lat: 19.7070, lng: -101.1950,
    activo: false
  },
  {
    nombre: "Estilista Ejemplo",
    categoria: "Estilista",
    lat: 19.6950, lng: -101.1750,
    activo: false
  }
];

/* =========================================================
   MAPA
   ========================================================= */
const map = L.map('map').setView([19.7008, -101.1844], 14); // Morelia, Michoacán

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/* =========================================================
   MARCADORES GUARDADOS (localStorage)
   Los que agregues desde el botón "Añadir marcador" se
   guardan en el navegador para que sigan ahí la próxima
   vez que abras la página.
   ========================================================= */
const CLAVE_STORAGE = 'mapaNegocios_marcadores';

function cargarMarcadoresGuardados() {
  try {
    const datos = localStorage.getItem(CLAVE_STORAGE);
    return datos ? JSON.parse(datos) : [];
  } catch (e) {
    return [];
  }
}

function guardarMarcadoresEnStorage() {
  localStorage.setItem(CLAVE_STORAGE, JSON.stringify(marcadoresGuardados));
}

// Le damos un id a cada negocio de ejemplo para poder editarlo igual que a los nuevos
negocios.forEach((n, i) => { n.id = 'seed-' + i; });

let marcadoresGuardados = cargarMarcadoresGuardados();
let todosLosMarcadores = negocios.concat(marcadoresGuardados);

// referencia leaflet + fila del sidebar por id, para poder actualizarlas
const referencias = {};

function crearIcono(n) {
  if (n.activo) {
    return L.divIcon({
      className: '',
      html: `<div class="marker-activo" style="background:${n.color || '#1a73e8'}"><span>${n.emoji || '📍'}</span></div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 38]
    });
  }
  return L.divIcon({
    className: '',
    html: `<div class="marker-gris"></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
}

function popupHtml(n) {
  return n.activo
    ? `<div class="popup-negocio">
         <strong>${n.nombre || 'Sin nombre'}</strong>${n.categoria ? '<br>' + n.categoria : ''}
         <br><a href="${n.url}" target="_blank" rel="noopener">Ver página web</a>
       </div>`
    : `<div class="popup-negocio inactivo">
         <strong>${n.nombre || 'Sin nombre'}</strong>${n.categoria ? '<br>' + n.categoria : ''}
         <p>Página web aún no disponible</p>
       </div>`;
}

function crearMarcadorEnMapa(n) {
  const marker = L.marker([n.lat, n.lng], { icon: crearIcono(n) }).addTo(map);
  marker.bindPopup(popupHtml(n));
  referencias[n.id] = referencias[n.id] || {};
  referencias[n.id].marker = marker;
}

function refrescarMarcadorEnMapa(n) {
  const ref = referencias[n.id];
  if (ref && ref.marker) {
    ref.marker.setIcon(crearIcono(n));
    ref.marker.setPopupContent(popupHtml(n));
  }
}

todosLosMarcadores.forEach(crearMarcadorEnMapa);

/* =========================================================
   BARRA LATERAL: abrir/cerrar y submenú de marcadores
   ========================================================= */
const sidebar = document.getElementById('sidebar');
const btnMenu = document.getElementById('btnMenu');
const btnMarcadores = document.getElementById('btnMarcadores');
const submenuMarcadores = document.getElementById('submenuMarcadores');
const listaMarcadores = document.getElementById('listaMarcadores');
const btnAnadirMarcador = document.getElementById('btnAnadirMarcador');
const avisoColocar = document.getElementById('avisoColocar');

btnMenu.addEventListener('click', () => sidebar.classList.toggle('abierto'));

btnMarcadores.addEventListener('click', () => submenuMarcadores.classList.toggle('abierto'));

function renderListaMarcadores() {
  listaMarcadores.innerHTML = '';
  todosLosMarcadores.forEach(n => {
    const fila = document.createElement('div');
    fila.className = 'marcador-casilla';

    const btnNombre = document.createElement('button');
    btnNombre.className = 'nombre-btn' + (n.nombre ? '' : ' sin-nombre');
    btnNombre.textContent = n.nombre || 'Sin nombre (configurar)';
    btnNombre.addEventListener('click', () => abrirModalConfig(n));

    const btnUbicar = document.createElement('button');
    btnUbicar.className = 'btn-ubicar';
    btnUbicar.textContent = 'Ubicar';
    btnUbicar.addEventListener('click', () => {
      map.flyTo([n.lat, n.lng], 17);
      const ref = referencias[n.id];
      if (ref && ref.marker) ref.marker.openPopup();
    });

    fila.appendChild(btnNombre);
    fila.appendChild(btnUbicar);
    listaMarcadores.appendChild(fila);
  });
}
renderListaMarcadores();

/* =========================================================
   MODO "AÑADIR MARCADOR": el siguiente clic en el mapa
   coloca el punto de forma fija
   ========================================================= */
let modoColocar = false;

btnAnadirMarcador.addEventListener('click', () => {
  modoColocar = true;
  avisoColocar.style.display = 'block';
  sidebar.classList.remove('abierto');
});

map.on('click', function (e) {
  if (!modoColocar) return;
  modoColocar = false;
  avisoColocar.style.display = 'none';

  const nuevo = {
    id: 'm-' + Date.now(),
    nombre: '',
    categoria: '',
    lat: e.latlng.lat,
    lng: e.latlng.lng,
    activo: false
  };
  todosLosMarcadores.push(nuevo);
  marcadoresGuardados.push(nuevo);
  crearMarcadorEnMapa(nuevo);
  renderListaMarcadores();
  guardarMarcadoresEnStorage();

  abrirModalConfig(nuevo);
});

/* =========================================================
   MODAL DE CONFIGURACIÓN (nombre, emoji, color, enlace)
   ========================================================= */
const overlayModal = document.getElementById('overlayModal');
const inpNombre = document.getElementById('inpNombre');
const inpEmoji = document.getElementById('inpEmoji');
const inpColor = document.getElementById('inpColor');
const inpUrl = document.getElementById('inpUrl');
const btnGuardarMarcador = document.getElementById('btnGuardarMarcador');
const btnCancelarMarcador = document.getElementById('btnCancelarMarcador');

let marcadorEnEdicion = null;

function abrirModalConfig(n) {
  marcadorEnEdicion = n;
  inpNombre.value = n.nombre || '';
  inpEmoji.value = n.emoji || '';
  inpColor.value = n.color || '#1a73e8';
  inpUrl.value = n.url || '';
  overlayModal.classList.add('abierto');
  sidebar.classList.remove('abierto');
}

function cerrarModalConfig() {
  overlayModal.classList.remove('abierto');
  marcadorEnEdicion = null;
}

btnCancelarMarcador.addEventListener('click', cerrarModalConfig);

btnGuardarMarcador.addEventListener('click', () => {
  if (!marcadorEnEdicion) return;

  marcadorEnEdicion.nombre = inpNombre.value.trim();
  marcadorEnEdicion.emoji = inpEmoji.value.trim();
  marcadorEnEdicion.color = inpColor.value;
  marcadorEnEdicion.url = inpUrl.value.trim();
  // Se considera "activo" (a color, con liga) en cuanto tiene nombre y enlace
  marcadorEnEdicion.activo = !!(marcadorEnEdicion.nombre && marcadorEnEdicion.url);

  refrescarMarcadorEnMapa(marcadorEnEdicion);
  renderListaMarcadores();

  // Solo se persisten en localStorage los que TÚ agregaste (no los de ejemplo)
  if (marcadoresGuardados.includes(marcadorEnEdicion)) {
    guardarMarcadoresEnStorage();
  }

  cerrarModalConfig();
});
</script>

</body>
</html>
